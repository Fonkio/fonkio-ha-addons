name: "Fonkio's Transmission OpenVPN"
version: "5.5.2"
slug: "transmission_openvpn_fonkio"
description: "Transmission avec tunnel VPN OpenVPN"
url: "https://hub.docker.com/r/haugene/transmission-openvpn/"

arch:
  - amd64
  - aarch64

ports:
  9091/tcp: 9091

map:
  - type: app_config
    read_only: false
  - type: share
    read_only: false

image: "haugene/transmission-openvpn"

devices:
  - /dev/net/tun

privileged:
  - NET_ADMIN

legacy: true

environment:
  CREATE_TUN_DEVICE: "false"
  TRANSMISSION_INCOMPLETE_DIR_ENABLED: "true"

options:
  OPENVPN_PROVIDER: "PIA"
  OPENVPN_CONFIG: "france"
  LOCAL_NETWORK: "192.168.0.0/16"
  TRANSMISSION_DOWNLOAD_DIR: "/share/downloads"
  TRANSMISSION_INCOMPLETE_DIR: "/share/incomplete"
  TRANSMISSION_WEB_UI: "combustion"
  TRANSMISSION_RPC_ENABLED: true
  TRANSMISSION_RPC_AUTHENTICATION_REQUIRED: true
  TRANSMISSION_RPC_USERNAME: ""
  TRANSMISSION_RPC_PASSWORD: ""

schema:
  OPENVPN_PROVIDER: str
  OPENVPN_CONFIG: str
  OPENVPN_USERNAME: str
  OPENVPN_PASSWORD: password
  LOCAL_NETWORK: str
  TRANSMISSION_DOWNLOAD_DIR: str
  TRANSMISSION_INCOMPLETE_DIR: str
  TRANSMISSION_WEB_UI: list(default|combustion|kettu|transmission-web-control|flood-for-transmission|shift|transmissionic)
  TRANSMISSION_RPC_ENABLED: bool
  TRANSMISSION_RPC_AUTHENTICATION_REQUIRED: bool
  TRANSMISSION_RPC_USERNAME: str
  TRANSMISSION_RPC_PASSWORD: password